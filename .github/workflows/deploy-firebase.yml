name: Deploy Firebase Hosting

# ก่อนหน้านี้หน้าเว็บต้อง `firebase deploy` ด้วยมือทุกครั้ง — ถ้าลืมก็จะแก้โค้ดแล้ว
# ของจริงบนเว็บไม่เปลี่ยน workflow นี้เลย deploy ให้อัตโนมัติเมื่อไฟล์หน้าเว็บถูกแก้
#
# ⚠️ ตั้งใจ deploy เฉพาะ Hosting เท่านั้น
#    Cloud Functions และ Database Rules ยัง deploy ด้วยมือ เพราะมีผลกระทบสูง
#    (ลบข้อมูล / ตัดสิทธิ์เข้าถึง) ควรมีคนตรวจแล้วกดเอง:
#      .\deploy-functions.bat
#      cd web-rpa && firebase deploy --only database
#
# ต้องตั้ง secret อย่างใดอย่างหนึ่งก่อนใช้งาน (ดูวิธีใน README):
#   FIREBASE_SERVICE_ACCOUNT — JSON ของ service account   ← แนะนำ
#   FIREBASE_TOKEN           — token จาก `firebase login:ci` ← ตั้งง่ายกว่า แต่เป็นสิทธิ์บัญชีคุณทั้งบัญชี

on:
  push:
    branches: [main]
    paths:
      - "web-rpa/public/**"
      - "web-rpa/firebase.json"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch: {} # กด "Run workflow" เองได้จากแท็บ Actions

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
            echo "AUTH_MODE=service-account" >> "$GITHUB_ENV"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
            echo "ใช้ service account"
          elif [ -n "$FB_TOKEN" ]; then
            echo "AUTH_MODE=token" >> "$GITHUB_ENV"
            echo "ใช้ FIREBASE_TOKEN"
          else
            echo "::error::ยังไม่ได้ตั้ง secret — ต้องมี FIREBASE_SERVICE_ACCOUNT หรือ FIREBASE_TOKEN (ดูวิธีใน README)"
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        working-directory: web-rpa
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools@15 deploy \
            --only hosting \
            --project com7-rpa-log \
            --non-interactive \
            --message "${{ github.sha }} by ${{ github.actor }}"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
