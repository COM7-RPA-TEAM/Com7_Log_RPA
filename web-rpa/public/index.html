<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPA Enterprise Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    /* ==========================================
           🎨 SVG Animations & Graphics
           ========================================== */
    .hero-section {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      position: relative;
      padding: 3rem 0 5rem 0;
      overflow: hidden;
    }

    .wave-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }

    .wave-svg {
      position: relative;
      display: block;
      width: calc(100% + 1.3px);
      height: 60px;
    }

    .wave-path {
      fill: #f4f7f6;
      animation: waveAnim 10s linear infinite;
    }

    @keyframes waveAnim {
      0% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(-2%);
      }

      100% {
        transform: translateX(0);
      }
    }

    .floating-robot {
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0px 10px 10px rgba(0, 0, 0, 0.2));
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-15px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .spinning-gear {
      animation: spin 8s linear infinite;
      transform-origin: center;
      opacity: 0.2;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* ==========================================
           UI Components Styles
           ========================================== */
    .card-bot {
      transition: transform 0.2s, box-shadow 0.2s;
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .card-bot:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    .status-Running {
      background-color: #0dcaf0;
      color: white;
    }

    .status-Success {
      background-color: #198754;
      color: white;
    }

    .status-Failed {
      background-color: #dc3545;
      color: white;
    }

    .status-badge {
      font-size: 0.85em;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    .table-status-badge {
      font-size: 0.8em;
      padding: 4px 8px;
      border-radius: 12px;
    }

    .action-btns {
      opacity: 0.3;
      transition: 0.3s;
    }

    .card-bot:hover .action-btns,
    tr:hover .action-btns {
      opacity: 1;
    }

    /* สไตล์สำหรับตาราง History แบบ Compact (บรรทัดเตี้ย) */
    .table-compact td,
    .table-compact th {
      padding: 0.4rem 0.5rem;
      font-size: 0.85rem;
      vertical-align: middle;
    }

    .table-compact tbody tr:hover {
      background-color: #f1f4f8;
    }

    /* Custom Tabs */
    .nav-pills .nav-link {
      color: #2a5298;
      font-weight: 600;
      border-radius: 30px;
      padding: 8px 20px;
      margin-right: 10px;
      transition: 0.3s;
    }

    .nav-pills .nav-link.active {
      background-color: #2a5298;
      color: white;
      box-shadow: 0 4px 8px rgba(42, 82, 152, 0.3);
    }
  </style>
</head>

<body>

  <div class="hero-section shadow-sm">
    <svg class="spinning-gear position-absolute" style="top: -20px; right: 10%; width: 150px; height: 150px;"
      viewBox="0 0 100 100" fill="white">
      <path
        d="M50,20 c-16.5,0-30,13.5-30,30 c0,16.5,13.5,30,30,30 c16.5,0,30-13.5,30-30 C80,33.5,66.5,20,50,20 z M50,70 c-11,0-20-9-20-20 c0-11,9-20,20-20 c11,0,20,9,20,20 C70,61,61,70,50,70 z" />
      <path
        d="M50,5 a5,5 0 0,0 -5,5 v5 a5,5 0 0,0 10,0 v-5 a5,5 0 0,0 -5,-5 zM50,85 a5,5 0 0,0 -5,5 v5 a5,5 0 0,0 10,0 v-5 a5,5 0 0,0 -5,-5 zM95,45 h-5 a5,5 0 0,0 0,10 h5 a5,5 0 0,0 0,-10 zM15,45 h-5 a5,5 0 0,0 0,10 h5 a5,5 0 0,0 0,-10 z" />
    </svg>

    <div class="container position-relative z-1 d-flex align-items-center justify-content-center text-center">
      <svg class="floating-robot me-3" width="70" height="70" viewBox="0 0 24 24" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C10.8954 2 10 2.89543 10 4V4.5H14V4C14 2.89543 13.1046 2 12 2Z" fill="#0dcaf0" />
        <rect x="4" y="8" width="16" height="12" rx="3" fill="white" />
        <circle cx="8" cy="13" r="2" fill="#2a5298" />
        <circle cx="16" cy="13" r="2" fill="#2a5298" />
        <path d="M9 17H15" stroke="#2a5298" stroke-width="1.5" stroke-linecap="round" />
        <rect x="2" y="10" width="2" height="6" rx="1" fill="#0dcaf0" />
        <rect x="20" y="10" width="2" height="6" rx="1" fill="#0dcaf0" />
      </svg>
      <div>
        <h1 class="fw-bold m-0" style="letter-spacing: 1px;">RPA Control Center</h1>
        <p class="m-0 opacity-75">Live Monitoring & Historical Logs</p>
      </div>
    </div>

    <div class="wave-container">
      <svg class="wave-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path class="wave-path"
          d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z"
          opacity=".25"></path>
        <path class="wave-path"
          d="M0,0V15.81C13,36.92,27.64,56.86,47.69,72.05,99.41,111.27,165,111,224.58,91.58c31.15-10.15,60.09-26.07,89.67-39.8,40.92-19,84.73-46,130.83-49.67,36.26-2.85,70.9,9.42,98.6,31.56,31.77,25.39,62.32,62,103.63,73,40.44,10.79,81.35-6.69,119.13-24.28s75.16-39,116.92-43.05c59.73-5.85,113.28,22.88,168.9,38.84,30.2,8.66,59,6.17,87.09-7.5,22.43-10.89,48-26.93,60.65-23.81V0Z"
          opacity=".5"></path>
        <path class="wave-path"
          d="M0,0V5.63C149.93,59,314.09,71.32,475.83,42.57c43-7.64,84.23-20.12,127.61-26.46,59-8.63,112.48,12.24,165.56,35.4C827.93,77.22,886,95.24,951.2,90c86.53-7,172.46-45.71,248.8-84.81V0Z">
        </path>
      </svg>
    </div>
  </div>

  <div class="container mt-4 mb-5">

    <ul class="nav nav-pills mb-4 justify-content-center" id="dashboardTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="live-tab" data-bs-toggle="pill" data-bs-target="#live-view" type="button"
          role="tab"><i class="fa-solid fa-satellite-dish me-2"></i>Live Dashboard</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="history-tab" data-bs-toggle="pill" data-bs-target="#history-view" type="button"
          role="tab"><i class="fa-solid fa-clock-rotate-left me-2"></i>History Logs</button>
      </li>
    </ul>

    <div class="tab-content" id="dashboardTabsContent">

      <div class="tab-pane fade show active" id="live-view" role="tabpanel">

        <div class="row align-items-center mb-4 bg-white p-3 rounded shadow-sm mx-0">
          <div class="col-md-6 mb-3 mb-md-0">
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i
                  class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="searchInput" class="form-control border-start-0"
                placeholder="ค้นหาชื่อ Bot (Search Bot Name)...">
            </div>
          </div>
          <div class="col-md-6 text-md-end">
            <div class="btn-group" role="group">
              <input type="radio" class="btn-check view-selector" name="viewType" id="view-card" value="card"
                autocomplete="off" checked>
              <label class="btn btn-outline-secondary btn-sm" for="view-card"><i class="fa-solid fa-border-all"></i>
                Card</label>

              <input type="radio" class="btn-check view-selector" name="viewType" id="view-list" value="list"
                autocomplete="off">
              <label class="btn btn-outline-secondary btn-sm" for="view-list"><i class="fa-solid fa-list"></i>
                List</label>
            </div>
          </div>
        </div>

        <div id="bot-container">
          <div class="text-center mt-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">กำลังดึงข้อมูล Live...</p>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="history-view" role="tabpanel">
        <div class="bg-white rounded shadow-sm p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-primary"><i class="fa-solid fa-database me-2"></i>ประวัติการรันล่าสุด (Latest
              500 records)</h5>
            <span class="badge bg-light text-dark border">อัปเดตแบบ Real-time</span>
          </div>

          <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
            <table class="table table-hover table-compact table-bordered mb-0">
              <thead class="table-dark" style="position: sticky; top: 0; z-index: 1;">
                <tr>
                  <th width="18%">Date / Time</th>
                  <th width="20%">Bot Name</th>
                  <th width="12%">Status</th>
                  <th width="25%">Stage</th>
                  <th width="25%">Error Message</th>
                </tr>
              </thead>
              <tbody id="history-container">
                <tr>
                  <td colspan="5" class="text-center py-4 text-muted"><i
                      class="fa-solid fa-spinner fa-spin me-2"></i>กำลังโหลดประวัติ...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square"></i> แก้ไขข้อมูล Live Status</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <div class="mb-3">
              <label class="form-label fw-bold">Bot Name</label>
              <input type="text" class="form-control bg-light" id="editBotName" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Status</label>
              <select class="form-select" id="editStatus">
                <option value="Running">Running</option>
                <option value="Success">Success</option>
                <option value="Failed">Failed</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Stage</label>
              <input type="text" class="form-control" id="editStage">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Error Message</label>
              <textarea class="form-control" id="editError" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-primary px-4" onclick="saveBotEdit()"><i
              class="fa-solid fa-save me-1"></i> บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // 🚨 ใส่ URL Firebase ของคุณให้ถูกต้อง
    const firebaseConfig = {
      databaseURL: "https://com7-rpa-log-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ตัวแปร Global
    const botContainer = document.getElementById('bot-container');
    const historyContainer = document.getElementById('history-container');
    const searchInput = document.getElementById('searchInput');
    let latestLiveData = null;
    let historyData = [];
    let currentLiveView = 'card';
    let searchQuery = '';
    let editModalInstance = null;

    document.addEventListener("DOMContentLoaded", function () {
      editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
    });

    // Utility: ดึงสี/ไอคอน
    function getStatusStyle(status) {
      if (status === "Running") return { class: "status-Running", icon: "fa-spinner fa-spin", textClass: "text-info" };
      if (status === "Success") return { class: "status-Success", icon: "fa-check-circle", textClass: "text-success" };
      if (status === "Failed") return { class: "status-Failed", icon: "fa-times-circle", textClass: "text-danger" };
      return { class: "bg-secondary", icon: "fa-circle-question", textClass: "text-secondary" };
    }

    // ==========================================
    // 1. ระบบ Live Dashboard (ดึงข้อมูล + วาดหน้าจอ + ค้นหา)
    // ==========================================
    function renderLiveDashboard() {
      if (!latestLiveData) {
        botContainer.innerHTML = '<div class="text-center mt-5"><p class="text-muted">ยังไม่มีข้อมูล Bot ในระบบ</p></div>';
        return;
      }

      let html = '';
      // กรองชื่อบอทตามช่อง Search
      const botNames = Object.keys(latestLiveData).filter(name => name.toLowerCase().includes(searchQuery.toLowerCase()));

      if (botNames.length === 0) {
        botContainer.innerHTML = '<div class="text-center mt-5"><i class="fa-solid fa-magnifying-glass text-muted fs-1 mb-3"></i><p class="text-muted">ไม่พบชื่อ Bot ที่ค้นหา</p></div>';
        return;
      }

      if (currentLiveView === 'card') {
        html += '<div class="row">';
        botNames.forEach(botName => {
          const info = latestLiveData[botName];
          const st = getStatusStyle(info.status);
          const timeDisplay = info.status_datetime || info.last_update || '-';
          const errorHtml = info.error_message ? `<div class="alert alert-danger mt-3 p-1 px-2 text-sm" style="font-size:0.75rem;"><i class="fa-solid fa-triangle-exclamation"></i> ${info.error_message}</div>` : '';

          html += `
                    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                        <div class="card card-bot h-100">
                            <div class="position-absolute top-0 end-0 p-2 action-btns z-1">
                                <button class="btn btn-sm btn-light text-primary border shadow-sm py-0 px-2" onclick="openEditModal('${botName}')" title="แก้ไข"><i class="fa-solid fa-pen" style="font-size:0.8rem;"></i></button>
                                <button class="btn btn-sm btn-light text-danger border shadow-sm py-0 px-2 ms-1" onclick="deleteBot('${botName}')" title="ลบ"><i class="fa-solid fa-trash" style="font-size:0.8rem;"></i></button>
                            </div>
                            <div class="card-body pt-4 pb-2">
                                <h6 class="fw-bold mb-3 text-truncate" title="${botName}"><i class="fa-solid fa-robot text-secondary me-1"></i> ${botName}</h6>
                                <span class="badge ${st.class} status-badge mb-3"><i class="fa-solid ${st.icon}"></i> ${info.status}</span>
                                <p class="card-text m-0 text-muted" style="font-size:0.75rem;">Stage:</p>
                                <p class="card-text fw-semibold text-primary" style="font-size:0.9rem;">${info.stage}</p>
                                ${errorHtml}
                            </div>
                            <div class="card-footer bg-transparent text-muted border-0 pt-0" style="font-size: 0.7rem;">
                                <i class="fa-regular fa-clock"></i> ${timeDisplay}
                            </div>
                        </div>
                    </div>`;
        });
        html += '</div>';
      }
      else if (currentLiveView === 'list') {
        html += `
            <div class="table-responsive bg-white rounded shadow-sm">
                <table class="table table-hover align-middle mb-0 text-sm" style="font-size: 0.9rem;">
                    <thead class="table-light">
                        <tr>
                            <th>Bot Name</th>
                            <th>Status</th>
                            <th>Current Stage</th>
                            <th>Date / Time</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>`;
        botNames.forEach(botName => {
          const info = latestLiveData[botName];
          const st = getStatusStyle(info.status);
          const timeDisplay = info.status_datetime || info.last_update || '-';
          const stageDisplay = info.status === "Failed" && info.error_message
            ? `<span>${info.stage}</span> <br><small class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> ${info.error_message}</small>`
            : info.stage;

          html += `
                    <tr>
                        <td class="fw-bold"><i class="fa-solid fa-robot text-secondary me-2"></i>${botName}</td>
                        <td><span class="badge ${st.class} table-status-badge"><i class="fa-solid ${st.icon}"></i> ${info.status}</span></td>
                        <td>${stageDisplay}</td>
                        <td class="text-muted" style="font-size:0.85rem;">${timeDisplay}</td>
                        <td class="text-center action-btns">
                            <button class="btn btn-sm btn-outline-primary py-0 px-2" onclick="openEditModal('${botName}')"><i class="fa-solid fa-pen" style="font-size:0.7rem;"></i></button>
                            <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteBot('${botName}')"><i class="fa-solid fa-trash" style="font-size:0.7rem;"></i></button>
                        </td>
                    </tr>`;
        });
        html += `</tbody></table></div>`;
      }
      botContainer.innerHTML = html;
    }

    // ดึง Live Data
    db.ref('rpa_live_status').on('value', (snapshot) => {
      latestLiveData = snapshot.val();
      renderLiveDashboard();
    });

    // จับ Event การ Search
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderLiveDashboard();
    });

    // เปลี่ยน View (Card / List)
    document.querySelectorAll('.view-selector').forEach(radio => {
      radio.addEventListener('change', (e) => {
        currentLiveView = e.target.value;
        renderLiveDashboard();
      });
    });

    // ==========================================
    // 2. ระบบ History Logs (โหลด 500 รายการล่าสุด)
    // ==========================================
    function renderHistoryLogs() {
      if (historyData.length === 0) {
        historyContainer.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">ยังไม่มีประวัติการรัน</td></tr>';
        return;
      }

      let html = '';
      historyData.forEach(log => {
        const st = getStatusStyle(log.status);
        const errorText = log.error_message ? `<span class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> ${log.error_message}</span>` : `<span class="text-success">-</span>`;

        html += `
                <tr>
                    <td class="text-muted">${log.status_datetime || '-'}</td>
                    <td class="fw-bold text-dark"><i class="fa-solid fa-robot text-secondary me-1" style="font-size:0.7rem;"></i> ${log.bot_name}</td>
                    <td><span class="${st.textClass} fw-bold" style="font-size:0.8rem;"><i class="fa-solid ${st.icon}"></i> ${log.status}</span></td>
                    <td class="text-primary">${log.stage}</td>
                    <td style="font-size:0.8rem;">${errorText}</td>
                </tr>
            `;
      });
      historyContainer.innerHTML = html;
    }

    // ดึง History Data (จำกัด 500 รายการ ป้องกันเว็บค้าง)
    db.ref('rpa_history_logs').orderByChild('status_datetime').limitToLast(500).on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // แปลง Object เป็น Array แล้วสลับให้รายการใหม่สุดอยู่ด้านบน
        historyData = Object.values(data).sort((a, b) => {
          const timeA = a.status_datetime || "";
          const timeB = b.status_datetime || "";
          return timeB.localeCompare(timeA);
        });
        renderHistoryLogs();
      }
    });

    // ==========================================
    // 3. ฟังก์ชัน Edit / Delete (อัปเดตเฉพาะ Live Status)
    // ==========================================
    window.openEditModal = function (botName) {
      const info = latestLiveData[botName];
      document.getElementById('editBotName').value = botName;
      document.getElementById('editStatus').value = info.status;
      document.getElementById('editStage').value = info.stage;
      document.getElementById('editError').value = info.error_message || '';
      editModalInstance.show();
    };

    window.saveBotEdit = function () {
      const botName = document.getElementById('editBotName').value;

      // สร้างเวลาปัจจุบันเพื่ออัปเดตลง Log
      const now = new Date();
      const formattedTime = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');

      const updateData = {
        status: document.getElementById('editStatus').value,
        stage: document.getElementById('editStage').value,
        error_message: document.getElementById('editError').value,
        status_datetime: formattedTime
      };

      // 1. อัปเดต Live
      db.ref('rpa_live_status/' + botName).update(updateData)
        .then(() => {
          editModalInstance.hide();
          // 2. เด้งไปบันทึกเป็นประวัติการแก้ไขใน History ด้วย (Optional แต่แนะนำ)
          updateData.bot_name = botName + " (Manual Edit)";
          db.ref('rpa_history_logs').push(updateData);
        })
        .catch(err => alert("เกิดข้อผิดพลาด: " + err));
    };

    window.deleteBot = function (botName) {
      if (confirm(`⚠️ ต้องการลบสถานะของ "${botName}" ออกจากหน้า Live Dashboard ใช่หรือไม่?\n(ข้อมูลใน History จะยังคงอยู่)`)) {
        db.ref('rpa_live_status/' + botName).remove()
          .catch(err => alert("ลบไม่สำเร็จ: " + err));
      }
    };

  </script>
</body>

</html>
