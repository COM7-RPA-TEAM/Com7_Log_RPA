<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPA Real-time Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card-bot {
      transition: transform 0.2s;
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .card-bot:hover {
      transform: translateY(-5px);
    }

    .status-Running {
      background-color: #0dcaf0;
      color: white;
    }

    .status-Success {
      background-color: #198754;
      color: white;
    }

    .status-Failed {
      background-color: #dc3545;
      color: white;
    }

    .status-badge {
      font-size: 0.9em;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .table-status-badge {
      font-size: 0.85em;
      padding: 5px 10px;
      border-radius: 12px;
    }

    /* ปุ่ม Action (Edit/Delete) */
    .action-btns {
      opacity: 0.7;
      transition: 0.3s;
    }

    .action-btns:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h2 class="fw-bold text-primary m-0">
        <i class="fa-solid fa-robot"></i> RPA Live Dashboard
      </h2>

      <div class="btn-group" role="group">
        <input type="radio" class="btn-check view-selector" name="viewType" id="view-card" value="card"
          autocomplete="off" checked>
        <label class="btn btn-outline-primary" for="view-card"><i class="fa-solid fa-border-all"></i> Card</label>

        <input type="radio" class="btn-check view-selector" name="viewType" id="view-list" value="list"
          autocomplete="off">
        <label class="btn btn-outline-primary" for="view-list"><i class="fa-solid fa-list"></i> List</label>

        <input type="radio" class="btn-check view-selector" name="viewType" id="view-detail" value="detail"
          autocomplete="off">
        <label class="btn btn-outline-primary" for="view-detail"><i class="fa-solid fa-list-check"></i> Detail</label>
      </div>
    </div>

    <div id="bot-container">
      <div class="text-center mt-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">กำลังเชื่อมต่อ Firebase...</p>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-light">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square text-primary"></i> แก้ไขข้อมูล Bot</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <div class="mb-3">
              <label class="form-label fw-bold">Bot Name (ไม่สามารถแก้ชื่อได้)</label>
              <input type="text" class="form-control" id="editBotName" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Status</label>
              <select class="form-select" id="editStatus">
                <option value="Running">Running</option>
                <option value="Success">Success</option>
                <option value="Failed">Failed</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Stage</label>
              <input type="text" class="form-control" id="editStage">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Error Message (ถ้ามี)</label>
              <textarea class="form-control" id="editError" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-primary" onclick="saveBotEdit()"><i class="fa-solid fa-save"></i>
            บันทึกข้อมูล</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // 🚨 ใส่ URL Firebase ของคุณ
    const firebaseConfig = {
      databaseURL: "https://com7-rpa-log-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const botContainer = document.getElementById('bot-container');
    let latestData = null;
    let currentView = 'card';
    let editModalInstance = null; // เก็บตัวแปร Modal

    // รอให้หน้าเว็บโหลดเสร็จก่อนค่อยผูก Modal
    document.addEventListener("DOMContentLoaded", function () {
      editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
    });

    function getStatusStyle(status) {
      if (status === "Running") return { class: "status-Running", icon: "fa-spinner fa-spin" };
      if (status === "Success") return { class: "status-Success", icon: "fa-check-circle" };
      if (status === "Failed") return { class: "status-Failed", icon: "fa-times-circle" };
      return { class: "bg-secondary", icon: "fa-circle-question" };
    }

    // ==========================================
    // ฟังก์ชันเปิดหน้าต่าง Edit
    // ==========================================
    window.openEditModal = function (botName) {
      const info = latestData[botName];
      document.getElementById('editBotName').value = botName;
      document.getElementById('editStatus').value = info.status;
      document.getElementById('editStage').value = info.stage;
      document.getElementById('editError').value = info.error_message || '';
      editModalInstance.show();
    };

    // ==========================================
    // ฟังก์ชันบันทึกข้อมูลจากการ Edit ลง Firebase
    // ==========================================
    window.saveBotEdit = function () {
      const botName = document.getElementById('editBotName').value;
      const newStatus = document.getElementById('editStatus').value;
      const newStage = document.getElementById('editStage').value;
      const newError = document.getElementById('editError').value;

      // สร้างเวลาปัจจุบันให้ตรงฟอร์แมต
      const now = new Date();
      const formattedTime = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');

      db.ref('rpa_live_status/' + botName).update({
        status: newStatus,
        stage: newStage,
        error_message: newError,
        status_datetime: formattedTime
      }).then(() => {
        editModalInstance.hide();
      }).catch(err => alert("เกิดข้อผิดพลาดในการบันทึก: " + err));
    };

    // ==========================================
    // ฟังก์ชันลบข้อมูล Bot
    // ==========================================
    window.deleteBot = function (botName) {
      if (confirm(`⚠️ คุณแน่ใจหรือไม่ว่าต้องการลบประวัติการรันของ "${botName}" ?\n\n(หากบอทตัวนี้รันใหม่ ข้อมูลก็จะกลับมาอีกครั้ง)`)) {
        db.ref('rpa_live_status/' + botName).remove()
          .catch(err => alert("ลบไม่สำเร็จ: " + err));
      }
    };

    // ==========================================
    // ฟังก์ชันวาดหน้าจอ
    // ==========================================
    function renderDashboard() {
      if (!latestData) {
        botContainer.innerHTML = '<div class="text-center mt-5"><p class="text-muted">ยังไม่มีข้อมูล Bot ในระบบ</p></div>';
        return;
      }

      let html = '';
      const botNames = Object.keys(latestData);

      if (currentView === 'card') {
        html += '<div class="row">';
        botNames.forEach(botName => {
          const info = latestData[botName];
          const st = getStatusStyle(info.status);
          // ดึง status_datetime ตาม payload ใหม่ (เผื่อของเก่าเป็น last_update เลยใส่ || ไว้กันเหนียว)
          const timeDisplay = info.status_datetime || info.last_update || '-';
          const errorHtml = info.error_message ? `<div class="alert alert-danger mt-3 p-2 text-sm" style="font-size:0.8rem;"><i class="fa-solid fa-triangle-exclamation"></i> ${info.error_message}</div>` : '';

          html += `
                    <div class="col-md-4 col-sm-6 mb-4">
                        <div class="card card-bot h-100">
                            <div class="position-absolute top-0 end-0 p-2 action-btns">
                                <button class="btn btn-sm btn-light text-primary border shadow-sm" onclick="openEditModal('${botName}')" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-sm btn-light text-danger border shadow-sm" onclick="deleteBot('${botName}')" title="ลบ"><i class="fa-solid fa-trash"></i></button>
                            </div>

                            <div class="card-body pt-4">
                                <h5 class="fw-bold mb-3"><i class="fa-solid fa-desktop text-secondary"></i> ${botName}</h5>
                                <span class="badge ${st.class} status-badge mb-3"><i class="fa-solid ${st.icon}"></i> ${info.status}</span>
                                <p class="card-text m-0 text-muted" style="font-size:0.85rem;">Stage ปัจจุบัน:</p>
                                <p class="card-text fw-semibold text-primary">${info.stage}</p>
                                ${errorHtml}
                            </div>
                            <div class="card-footer bg-white text-muted border-0" style="font-size: 0.75rem;">
                                <i class="fa-regular fa-clock"></i> ${timeDisplay}
                            </div>
                        </div>
                    </div>`;
        });
        html += '</div>';
      }
      else if (currentView === 'list') {
        html += `
            <div class="table-responsive bg-white rounded shadow-sm">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Bot Name</th>
                            <th>Status</th>
                            <th>Current Stage</th>
                            <th>Date / Time</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>`;
        botNames.forEach(botName => {
          const info = latestData[botName];
          const st = getStatusStyle(info.status);
          const timeDisplay = info.status_datetime || info.last_update || '-';
          const stageDisplay = info.status === "Failed" && info.error_message
            ? `<span>${info.stage}</span> <br><small class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> ${info.error_message}</small>`
            : info.stage;

          html += `
                    <tr>
                        <td class="fw-bold"><i class="fa-solid fa-desktop text-secondary me-2"></i>${botName}</td>
                        <td><span class="badge ${st.class} table-status-badge"><i class="fa-solid ${st.icon}"></i> ${info.status}</span></td>
                        <td>${stageDisplay}</td>
                        <td class="text-muted" style="font-size:0.85rem;">${timeDisplay}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-primary" onclick="openEditModal('${botName}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteBot('${botName}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
        });
        html += `</tbody></table></div>`;
      }
      else if (currentView === 'detail') {
        html += '<div class="row">';
        botNames.forEach(botName => {
          const info = latestData[botName];
          const st = getStatusStyle(info.status);
          const timeDisplay = info.status_datetime || info.last_update || '-';
          const errorHtml = info.error_message
            ? `<tr><th class="text-danger">Error Msg:</th><td><code class="text-danger">${info.error_message}</code></td></tr>`
            : '';

          html += `
                    <div class="col-12 mb-3">
                        <div class="card border-start border-4 ${info.status === 'Failed' ? 'border-danger' : info.status === 'Success' ? 'border-success' : 'border-info'} shadow-sm">
                            <div class="card-body row align-items-center position-relative">
                                
                                <div class="position-absolute top-0 end-0 p-2 text-end" style="width: auto;">
                                    <button class="btn btn-sm text-primary" onclick="openEditModal('${botName}')"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn btn-sm text-danger" onclick="deleteBot('${botName}')"><i class="fa-solid fa-trash"></i></button>
                                </div>

                                <div class="col-md-3">
                                    <h5 class="fw-bold m-0">${botName}</h5>
                                    <small class="text-muted">${timeDisplay}</small>
                                </div>
                                <div class="col-md-2 text-md-center mt-2 mt-md-0">
                                    <span class="badge ${st.class} status-badge"><i class="fa-solid ${st.icon}"></i> ${info.status}</span>
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <table class="table table-sm table-borderless m-0" style="font-size: 0.9rem;">
                                        <tr><th width="20%">Stage:</th><td class="fw-semibold text-primary">${info.stage}</td></tr>
                                        ${errorHtml}
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>`;
        });
        html += '</div>';
      }
      botContainer.innerHTML = html;
    }

    // ดึงข้อมูล Real-time
    db.ref('rpa_live_status').on('value', (snapshot) => {
      latestData = snapshot.val();
      renderDashboard();
    });

    // เปลี่ยน View
    const radios = document.querySelectorAll('.view-selector');
    radios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        currentView = e.target.value;
        renderDashboard();
      });
    });

  </script>
</body>

</html>
