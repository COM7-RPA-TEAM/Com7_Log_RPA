<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPA Real-time Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* สไตล์สำหรับ Card View */
    .card-bot {
      transition: transform 0.2s;
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card-bot:hover {
      transform: translateY(-5px);
    }

    /* สไตล์สำหรับ Status */
    .status-Running {
      background-color: #0dcaf0;
      color: white;
    }

    .status-Success {
      background-color: #198754;
      color: white;
    }

    .status-Failed {
      background-color: #dc3545;
      color: white;
    }

    .status-badge {
      font-size: 0.9em;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .table-status-badge {
      font-size: 0.85em;
      padding: 5px 10px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h2 class="fw-bold text-primary m-0">
        <i class="fa-solid fa-robot"></i> RPA Live Dashboard
      </h2>

      <div class="btn-group" role="group" aria-label="View Toggle">
        <input type="radio" class="btn-check view-selector" name="viewType" id="view-card" value="card"
          autocomplete="off" checked>
        <label class="btn btn-outline-primary" for="view-card"><i class="fa-solid fa-border-all"></i> Card</label>

        <input type="radio" class="btn-check view-selector" name="viewType" id="view-list" value="list"
          autocomplete="off">
        <label class="btn btn-outline-primary" for="view-list"><i class="fa-solid fa-list"></i> List</label>

        <input type="radio" class="btn-check view-selector" name="viewType" id="view-detail" value="detail"
          autocomplete="off">
        <label class="btn btn-outline-primary" for="view-detail"><i class="fa-solid fa-list-check"></i> Detail</label>
      </div>
    </div>

    <div id="bot-container">
      <div class="text-center mt-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">กำลังเชื่อมต่อ Firebase...</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // 🚨 อย่าลืมเช็ค URL Firebase ของคุณให้ตรงนะครับ
    const firebaseConfig = {
      databaseURL: "https://com7-rpa-log-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const botContainer = document.getElementById('bot-container');

    // ตัวแปรเก็บข้อมูลล่าสุด และ View ปัจจุบัน
    let latestData = null;
    let currentView = 'card';

    // ฟังก์ชันดึงไอคอนและสีตามสถานะ (ใช้ซ้ำได้ทุก View)
    function getStatusStyle(status) {
      if (status === "Running") return { class: "status-Running", icon: "fa-spinner fa-spin", textClass: "text-info" };
      if (status === "Success") return { class: "status-Success", icon: "fa-check-circle", textClass: "text-success" };
      if (status === "Failed") return { class: "status-Failed", icon: "fa-times-circle", textClass: "text-danger" };
      return { class: "bg-secondary", icon: "fa-circle-question", textClass: "text-secondary" };
    }

    // ฟังก์ชันหลักสำหรับวาดหน้าจอ (Render)
    function renderDashboard() {
      if (!latestData) {
        botContainer.innerHTML = '<div class="text-center mt-5"><p class="text-muted">ยังไม่มีข้อมูล Bot ในระบบ</p></div>';
        return;
      }

      let html = '';
      const botNames = Object.keys(latestData);

      // ==========================================
      // 1. วาดแบบ CARD VIEW (ดูง่าย สบายตา)
      // ==========================================
      if (currentView === 'card') {
        html += '<div class="row">';
        botNames.forEach(botName => {
          const info = latestData[botName];
          const st = getStatusStyle(info.status);
          const errorHtml = info.error_message ? `<div class="alert alert-danger mt-3 p-2 text-sm" style="font-size:0.8rem;"><i class="fa-solid fa-triangle-exclamation"></i> ${info.error_message}</div>` : '';

          html += `
                    <div class="col-md-4 col-sm-6 mb-4">
                        <div class="card card-bot h-100">
                            <div class="card-body">
                                <h5 class="fw-bold mb-3"><i class="fa-solid fa-desktop text-secondary"></i> ${botName}</h5>
                                <span class="badge ${st.class} status-badge mb-3"><i class="fa-solid ${st.icon}"></i> ${info.status}</span>
                                <p class="card-text m-0 text-muted" style="font-size:0.85rem;">Stage ปัจจุบัน:</p>
                                <p class="card-text fw-semibold text-primary">${info.stage}</p>
                                ${errorHtml}
                            </div>
                            <div class="card-footer bg-white text-muted text-end border-0" style="font-size: 0.75rem;">
                                <i class="fa-regular fa-clock"></i> ${info.last_update}
                            </div>
                        </div>
                    </div>`;
        });
        html += '</div>';
      }

      // ==========================================
      // 2. วาดแบบ LIST VIEW (ตารางสรุป เน้นประหยัดพื้นที่)
      // ==========================================
      else if (currentView === 'list') {
        html += `
            <div class="table-responsive bg-white rounded shadow-sm">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Bot Name</th>
                            <th>Status</th>
                            <th>Current Stage</th>
                            <th>Last Update</th>
                        </tr>
                    </thead>
                    <tbody>`;
        botNames.forEach(botName => {
          const info = latestData[botName];
          const st = getStatusStyle(info.status);
          // ถ้า Failed ให้แสดง Error ต่อท้าย Stage เลย
          const stageDisplay = info.status === "Failed" && info.error_message
            ? `<span>${info.stage}</span> <br><small class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> ${info.error_message}</small>`
            : info.stage;

          html += `
                    <tr>
                        <td class="fw-bold"><i class="fa-solid fa-desktop text-secondary me-2"></i>${botName}</td>
                        <td><span class="badge ${st.class} table-status-badge"><i class="fa-solid ${st.icon}"></i> ${info.status}</span></td>
                        <td>${stageDisplay}</td>
                        <td class="text-muted" style="font-size:0.85rem;">${info.last_update}</td>
                    </tr>`;
        });
        html += `</tbody></table></div>`;
      }

      // ==========================================
      // 3. วาดแบบ DETAIL VIEW (แสดงเต็มจอ เหมาะกับสาย Debug)
      // ==========================================
      else if (currentView === 'detail') {
        html += '<div class="row">';
        botNames.forEach(botName => {
          const info = latestData[botName];
          const st = getStatusStyle(info.status);
          const errorHtml = info.error_message
            ? `<tr><th class="text-danger">Error Msg:</th><td><code class="text-danger">${info.error_message}</code></td></tr>`
            : '';

          html += `
                    <div class="col-12 mb-3">
                        <div class="card border-start border-4 ${info.status === 'Failed' ? 'border-danger' : info.status === 'Success' ? 'border-success' : 'border-info'} shadow-sm">
                            <div class="card-body row align-items-center">
                                <div class="col-md-3">
                                    <h5 class="fw-bold m-0">${botName}</h5>
                                    <small class="text-muted">${info.last_update}</small>
                                </div>
                                <div class="col-md-2 text-md-center mt-2 mt-md-0">
                                    <span class="badge ${st.class} status-badge"><i class="fa-solid ${st.icon}"></i> ${info.status}</span>
                                </div>
                                <div class="col-md-7 mt-3 mt-md-0">
                                    <table class="table table-sm table-borderless m-0" style="font-size: 0.9rem;">
                                        <tr><th width="20%">Stage:</th><td class="fw-semibold text-primary">${info.stage}</td></tr>
                                        ${errorHtml}
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>`;
        });
        html += '</div>';
      }

      botContainer.innerHTML = html;
    }

    // ติดตามการเปลี่ยนแปลงข้อมูลจาก Firebase (ทำงานอัตโนมัติ)
    db.ref('rpa_live_status').on('value', (snapshot) => {
      latestData = snapshot.val();
      renderDashboard(); // โหลดเสร็จสั่งวาดหน้าจอ
    });

    // ดักจับการกดปุ่มเปลี่ยน View
    const radios = document.querySelectorAll('.view-selector');
    radios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        currentView = e.target.value;
        renderDashboard(); // เปลี่ยน View ปุ๊บ สั่งวาดหน้าจอใหม่ทันที (ไม่ต้องโหลดข้อมูลใหม่)
      });
    });

  </script>
</body>

</html>
