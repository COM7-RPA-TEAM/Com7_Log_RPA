<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COM7 RPA — TV Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ============================================================
       TV WALLBOARD — ออกแบบสำหรับอ่านไกล: จอมืดตายตัว ตัวหนังสือใหญ่
       คอนทราสต์สูง ไม่ต้องมี interaction (เปิดทิ้งไว้บนจอ TV ได้เลย)
       ============================================================ */
    :root {
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232322;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --line: rgba(255, 255, 255, .10);

      --running: #3987e5;
      --good: #0ca30c;
      --good-text: #2fbf2f;
      --critical: #d03b3b;
      --critical-text: #ff7a7a;
      --warning: #fab219;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: 'Inter', 'Kanit', system-ui, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      padding: 1.2vw 1.4vw;
      gap: 1vw;
    }

    body.idle { cursor: none; }

    /* ============ HEADER ============ */
    .tv-head {
      display: flex;
      align-items: center;
      gap: 1.2vw;
      flex: 0 0 auto;
    }

    .tv-brand {
      display: flex;
      align-items: center;
      gap: .8vw;
      font-size: 1.55vw;
      font-weight: 800;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .tv-brand .logo {
      width: 2.6vw;
      height: 2.6vw;
      min-width: 34px;
      min-height: 34px;
      border-radius: .6vw;
      background: var(--running);
      display: grid;
      place-items: center;
      font-size: 1.3vw;
    }

    .conn {
      display: inline-flex;
      align-items: center;
      gap: .5vw;
      font-size: 1vw;
      font-weight: 700;
      color: var(--muted);
      padding: .35vw .9vw;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .conn .dot { width: .7vw; height: .7vw; min-width: 8px; min-height: 8px; border-radius: 50%; background: var(--muted); }
    .conn.online { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
    .conn.online .dot { background: var(--good); box-shadow: 0 0 .6vw var(--good); }
    .conn.offline { color: var(--critical-text); }
    .conn.offline .dot { background: var(--critical); }

    .tv-clock {
      margin-left: auto;
      text-align: right;
      line-height: 1.15;
    }

    .tv-clock .time {
      font-size: 2.6vw;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: .03em;
    }

    .tv-clock .date { font-size: 1vw; color: var(--ink-2); font-weight: 500; }

    /* ============ KPI STRIP ============ */
    .tv-kpis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1vw;
      flex: 0 0 auto;
    }

    .tv-kpi {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1vw;
      padding: 1vw 1.3vw;
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .tv-kpi .ico {
      width: 3.2vw;
      height: 3.2vw;
      min-width: 40px;
      min-height: 40px;
      border-radius: .8vw;
      display: grid;
      place-items: center;
      font-size: 1.4vw;
      color: #fff;
      flex: 0 0 auto;
    }

    .tv-kpi.running .ico { background: var(--running); }
    .tv-kpi.success .ico { background: var(--good); }
    .tv-kpi.failed .ico { background: var(--critical); }
    .tv-kpi.stale .ico { background: var(--warning); color: #4a3600; }
    .tv-kpi.rate .ico { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

    .tv-kpi .val {
      font-size: 2.7vw;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .tv-kpi .lbl { font-size: .95vw; color: var(--ink-2); font-weight: 600; margin-top: .3vw; }

    .tv-kpi.failed.hot { border-color: var(--critical); box-shadow: 0 0 1.2vw color-mix(in srgb, var(--critical) 45%, transparent); }
    .tv-kpi.failed.hot .val { color: var(--critical-text); }
    .tv-kpi.stale.hot { border-color: var(--warning); }

    /* ============ ALERT BANNER ============ */
    .tv-alert[hidden] { display: none; } /* กัน display:flex ชนะ attribute hidden */

    .tv-alert {
      flex: 0 0 auto;
      border-radius: 1vw;
      border: 1px solid color-mix(in srgb, var(--critical) 45%, transparent);
      background: color-mix(in srgb, var(--critical) 12%, var(--surface));
      padding: .8vw 1.2vw;
      display: flex;
      align-items: center;
      gap: 1vw;
      font-size: 1.15vw;
      font-weight: 600;
    }

    .tv-alert .fa-triangle-exclamation {
      color: var(--critical-text);
      font-size: 1.5vw;
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink { 50% { opacity: .25; } }

    .tv-alert .items {
      display: flex;
      gap: 1.8vw;
      overflow: hidden;
      white-space: nowrap;
      flex: 1;
    }

    .tv-alert .items b { color: var(--critical-text); }
    .tv-alert .items .st b { color: var(--warning); }

    /* ============ BOT GRID ============ */
    .tv-grid {
      flex: 1;
      display: grid;
      gap: 1vw;
      overflow: hidden;
      align-content: start;
    }

    .tv-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: .45vw solid var(--muted);
      border-radius: .9vw;
      padding: 1vw 1.1vw;
      display: flex;
      flex-direction: column;
      gap: .45vw;
      min-width: 0;
    }

    .tv-card.b-Running { border-left-color: var(--running); }
    .tv-card.b-Success { border-left-color: var(--good); }
    .tv-card.b-Failed { border-left-color: var(--critical); background: color-mix(in srgb, var(--critical) 9%, var(--surface)); }
    .tv-card.b-Stale { border-left-color: var(--warning); background: color-mix(in srgb, var(--warning) 7%, var(--surface)); }

    .tv-card .name {
      font-weight: 700;
      font-size: 1.25vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tv-card .row2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8vw;
    }

    .tv-chip {
      display: inline-flex;
      align-items: center;
      gap: .4vw;
      font-size: .95vw;
      font-weight: 700;
      padding: .3vw .8vw;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tv-chip.s-Running { color: #9cc5f5; background: color-mix(in srgb, var(--running) 22%, transparent); }
    .tv-chip.s-Success { color: var(--good-text); background: color-mix(in srgb, var(--good) 18%, transparent); }
    .tv-chip.s-Failed { color: var(--critical-text); background: color-mix(in srgb, var(--critical) 22%, transparent); }
    .tv-chip.s-Stale { color: var(--warning); background: color-mix(in srgb, var(--warning) 18%, transparent); }
    .tv-chip.s-Unknown { color: var(--muted); background: var(--surface-2); }

    .tv-card .time { font-size: .95vw; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .tv-card .stage {
      font-size: .98vw;
      color: var(--ink-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tv-card .err {
      font-size: .92vw;
      color: var(--critical-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ============ FOOTER ============ */
    .tv-foot {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: .9vw;
    }

    .page-dots { display: flex; gap: .5vw; }

    .page-dots span {
      width: .65vw;
      height: .65vw;
      min-width: 8px;
      min-height: 8px;
      border-radius: 50%;
      background: var(--grid);
    }

    .page-dots span.cur { background: var(--ink-2); }

    .all-ok {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1vw;
      padding: 4vw 0;
      color: var(--good-text);
      font-size: 1.6vw;
      font-weight: 700;
    }

    .all-ok i { font-size: 4vw; }
  </style>
</head>

<body>
  <!-- HEADER -->
  <div class="tv-head">
    <div class="tv-brand">
      <div class="logo"><i class="fa-solid fa-robot"></i></div>
      COM7 RPA MONITOR
    </div>
    <span class="conn" id="connBadge"><span class="dot"></span><span id="connText">connecting…</span></span>
    <div class="tv-clock">
      <div class="time" id="tvTime">--:--:--</div>
      <div class="date" id="tvDate"></div>
    </div>
  </div>

  <!-- KPI STRIP -->
  <div class="tv-kpis">
    <div class="tv-kpi running"><div class="ico"><i class="fa-solid fa-spinner fa-spin"></i></div><div><div class="val" id="k-running">–</div><div class="lbl">Running</div></div></div>
    <div class="tv-kpi success"><div class="ico"><i class="fa-solid fa-check"></i></div><div><div class="val" id="k-success">–</div><div class="lbl">Success</div></div></div>
    <div class="tv-kpi failed" id="kpiFailed"><div class="ico"><i class="fa-solid fa-xmark"></i></div><div><div class="val" id="k-failed">–</div><div class="lbl">Failed</div></div></div>
    <div class="tv-kpi stale" id="kpiStale"><div class="ico"><i class="fa-solid fa-plug-circle-exclamation"></i></div><div><div class="val" id="k-stale">–</div><div class="lbl">ค้าง / Stale</div></div></div>
    <div class="tv-kpi rate"><div class="ico"><i class="fa-solid fa-percent"></i></div><div><div class="val" id="k-rate">–</div><div class="lbl">Success Rate วันนี้</div></div></div>
  </div>

  <!-- ALERT BANNER (โชว์เฉพาะเมื่อมีปัญหา) -->
  <div class="tv-alert" id="tvAlert" hidden>
    <i class="fa-solid fa-triangle-exclamation"></i>
    <div class="items" id="tvAlertItems"></div>
  </div>

  <!-- BOT GRID -->
  <div class="tv-grid" id="tvGrid"></div>

  <!-- FOOTER -->
  <div class="tv-foot">
    <span id="footInfo">COM7-RPA-TEAM · RPA Log Dashboard</span>
    <div class="page-dots" id="pageDots"></div>
    <span id="footUpdate"></span>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = { databaseURL: "https://com7-rpa-log-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let latestLiveData = null;
    let historyData = [];
    let staleThresholdMin = 30;   // ปรับผ่าน query string ได้: tv.html?stale=60
    let tvPage = 0;               // หน้าปัจจุบัน (auto-rotate เมื่อบอทเยอะเกินจอ)
    const PAGE_ROTATE_SEC = 12;

    const qs = new URLSearchParams(location.search);
    if (qs.get('stale')) staleThresholdMin = parseInt(qs.get('stale')) || 30;

    /* ---------- helpers (ชุดเดียวกับ index.html) ---------- */
    function parseDateTime(s) {
      if (!s) return null;
      const d = new Date(String(s).replace(' ', 'T'));
      return isNaN(d.getTime()) ? null : d;
    }

    function timeAgo(s) {
      const d = parseDateTime(s);
      if (!d) return s || '-';
      let diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 0) diff = 0;
      if (diff < 60) return 'เมื่อสักครู่';
      if (diff < 3600) return Math.floor(diff / 60) + ' นาทีที่แล้ว';
      if (diff < 86400) return Math.floor(diff / 3600) + ' ชม.ที่แล้ว';
      return Math.floor(diff / 86400) + ' วันที่แล้ว';
    }

    function normalizeStatus(raw) {
      const s = String(raw || '').trim().toLowerCase();
      if (['success', 'completed', 'complete', 'done', 'ok', 'passed', 'finish', 'finished'].includes(s)) return 'Success';
      if (['failed', 'fail', 'error', 'exception', 'crash'].includes(s)) return 'Failed';
      if (['running', 'start', 'started', 'in progress', 'processing', 'busy', 'pending'].includes(s)) return 'Running';
      return raw || 'Unknown';
    }

    function getEffectiveStatus(info) {
      if (!info) return 'Unknown';
      const norm = normalizeStatus(info.status);
      if (norm === 'Running') {
        const d = parseDateTime(info.status_datetime);
        if (d && (Date.now() - d.getTime()) > staleThresholdMin * 60000) return 'Stale';
      }
      return norm;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const STATE_ORDER = { Failed: 0, Stale: 1, Running: 2, Success: 3 };
    const STATUS_META = {
      Running: { icon: 'fa-spinner fa-spin', label: 'Running' },
      Success: { icon: 'fa-circle-check', label: 'Success' },
      Failed: { icon: 'fa-circle-xmark', label: 'Failed' },
      Stale: { icon: 'fa-plug-circle-exclamation', label: 'ค้าง' },
      Unknown: { icon: 'fa-circle-question', label: 'Unknown' }
    };

    function tvChip(eff) {
      const m = STATUS_META[eff] || STATUS_META.Unknown;
      const cls = STATUS_META[eff] ? eff : 'Unknown';
      return `<span class="tv-chip s-${cls}"><i class="fa-solid ${m.icon}"></i> ${m.label}</span>`;
    }

    function getSortedBots() {
      if (!latestLiveData) return [];
      return Object.keys(latestLiveData).map(botName => {
        const info = latestLiveData[botName];
        return { botName, info, eff: getEffectiveStatus(info) };
      }).sort((a, b) => {
        const oa = STATE_ORDER[a.eff] ?? 9, ob = STATE_ORDER[b.eff] ?? 9;
        if (oa !== ob) return oa - ob;
        return (b.info.status_datetime || '').localeCompare(a.info.status_datetime || '');
      });
    }

    /* ---------- คำนวณจำนวนการ์ดที่พอดีจอ (auto-fit + auto-rotate) ---------- */
    function gridCapacity() {
      const grid = document.getElementById('tvGrid');
      const W = grid.clientWidth, H = grid.clientHeight;
      const vw = window.innerWidth / 100;
      const cardW = Math.max(250, 19 * vw);   // การ์ดกว้างขั้นต่ำ ~19vw
      const cardH = Math.max(105, 8.2 * vw);  // สูงประมาณ 8.2vw
      const gap = vw;
      const cols = Math.max(1, Math.floor((W + gap) / (cardW + gap)));
      const rows = Math.max(1, Math.floor((H + gap) / (cardH + gap)));
      return { cols, perPage: cols * rows };
    }

    /* ---------- RENDER ---------- */
    function render() {
      const bots = getSortedBots();

      // KPI
      let s = 0, f = 0, r = 0, st = 0;
      bots.forEach(({ eff }) => {
        if (eff === 'Success') s++;
        else if (eff === 'Failed') f++;
        else if (eff === 'Running') r++;
        else if (eff === 'Stale') st++;
      });
      document.getElementById('k-running').textContent = r;
      document.getElementById('k-success').textContent = s;
      document.getElementById('k-failed').textContent = f;
      document.getElementById('k-stale').textContent = st;
      document.getElementById('kpiFailed').classList.toggle('hot', f > 0);
      document.getElementById('kpiStale').classList.toggle('hot', st > 0);

      // Success rate วันนี้
      const now = new Date();
      const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      let okT = 0, failT = 0;
      historyData.forEach(log => {
        if ((log.status_datetime || '').startsWith(todayStr)) {
          const ns = normalizeStatus(log.status);
          if (ns === 'Success') okT++;
          else if (ns === 'Failed') failT++;
        }
      });
      const denom = okT + failT;
      document.getElementById('k-rate').textContent = denom ? Math.round(okT / denom * 100) + '%' : '—';

      // Alert banner
      const alerts = bots.filter(b => b.eff === 'Failed' || b.eff === 'Stale');
      const banner = document.getElementById('tvAlert');
      if (alerts.length) {
        banner.hidden = false;
        document.getElementById('tvAlertItems').innerHTML = alerts.map(({ botName, info, eff }) =>
          eff === 'Failed'
            ? `<span><b>${esc(botName)}</b> — ${esc(info.error_message || ('พังที่ ' + (info.stage || '?')))}</span>`
            : `<span class="st"><b>${esc(botName)}</b> — ค้างที่ ${esc(info.stage || '?')} (${timeAgo(info.status_datetime)})</span>`
        ).join('');
      } else {
        banner.hidden = true;
      }

      // Bot grid + pagination
      const grid = document.getElementById('tvGrid');
      const dots = document.getElementById('pageDots');
      if (!bots.length) {
        grid.style.gridTemplateColumns = '1fr';
        grid.innerHTML = '<div class="all-ok" style="color:var(--muted)"><i class="fa-solid fa-inbox"></i>ยังไม่มีบอทส่งสถานะเข้ามา</div>';
        dots.innerHTML = '';
        return;
      }

      const { cols, perPage } = gridCapacity();
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      const totalPages = Math.max(1, Math.ceil(bots.length / perPage));
      if (tvPage >= totalPages) tvPage = 0;
      const pageBots = bots.slice(tvPage * perPage, (tvPage + 1) * perPage);

      grid.innerHTML = pageBots.map(({ botName, info, eff }) => {
        const detail = (eff === 'Failed' && info.error_message)
          ? `<div class="err"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(info.error_message)}</div>`
          : (eff === 'Stale'
            ? `<div class="err" style="color:var(--warning)"><i class="fa-solid fa-plug-circle-exclamation"></i> ไม่อัปเดตเกิน ${staleThresholdMin} นาที</div>`
            : `<div class="stage">Stage: ${esc(info.stage) || '-'}</div>`);
        return `
          <div class="tv-card b-${eff}">
            <div class="name" title="${esc(botName)}">${esc(botName)}</div>
            <div class="row2">${tvChip(eff)}<span class="time">${timeAgo(info.status_datetime)}</span></div>
            ${detail}
          </div>`;
      }).join('');

      // page dots
      dots.innerHTML = totalPages > 1
        ? Array.from({ length: totalPages }, (_, i) => `<span class="${i === tvPage ? 'cur' : ''}"></span>`).join('')
        : '';
      document.getElementById('footInfo').textContent =
        `COM7-RPA-TEAM · ${bots.length} บอท` + (totalPages > 1 ? ` · หน้า ${tvPage + 1}/${totalPages}` : '');
      document.getElementById('footUpdate').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
    }

    /* ---------- DATA ---------- */
    db.ref('rpa_live_status').on('value', (snap) => { latestLiveData = snap.val(); render(); });
    db.ref('rpa_history_logs').orderByChild('status_datetime').limitToLast(500).on('value', (snap) => {
      const data = snap.val();
      if (data) { historyData = Object.values(data); render(); }
    });

    db.ref('.info/connected').on('value', (snap) => {
      const on = snap.val() === true;
      const badge = document.getElementById('connBadge');
      badge.classList.toggle('online', on);
      badge.classList.toggle('offline', !on);
      document.getElementById('connText').textContent = on ? 'LIVE' : 'OFFLINE';
    });

    /* ---------- CLOCK ---------- */
    function tick() {
      const now = new Date();
      document.getElementById('tvTime').textContent = now.toLocaleTimeString('th-TH', { hour12: false });
      document.getElementById('tvDate').textContent = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    setInterval(tick, 1000);
    tick();

    /* ---------- AUTO-ROTATE + REFRESH ---------- */
    setInterval(() => { tvPage++; render(); }, PAGE_ROTATE_SEC * 1000);  // หมุนหน้าเมื่อบอทเยอะเกินจอ
    setInterval(render, 30000);                                          // เดินเวลา "X ที่แล้ว" + ตรวจ Stale
    window.addEventListener('resize', render);

    /* ---------- ซ่อนเคอร์เซอร์เมื่อไม่ขยับเมาส์ (โหมด TV) ---------- */
    let idleTimer = null;
    document.addEventListener('mousemove', () => {
      document.body.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
    });
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  </script>
</body>

</html>
